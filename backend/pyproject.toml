[project]
name = "volt-sight"
version = "0.1.0"
description = "Electricity dataset analytics and baseline ML API"
readme = "README.md"
authors = [
    { name = "Kanhiya Hurkat", email = "hkanhiya123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "app"
