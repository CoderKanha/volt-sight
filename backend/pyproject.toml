[project]
name = "volt-sight"
version = "0.1.0"
description = "Electricity dataset analytics and baseline ML API"
readme = "README.md"
authors = [
    { name = "Kanhiya Hurkat", email = "hkanhiya123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "app"
