[project]
name = "backend"
version = "0.1.0"
description = "Electricity dataset analytics and baseline ML API"
readme = "README.md"
authors = [
    { name = "Kanhiya Hurkat", email = "hkanhiya123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
volt-sight = "backend:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
